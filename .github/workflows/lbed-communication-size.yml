name: LBED communication size benchmark

on:
  workflow_dispatch:

jobs:
  communication-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout LBED repository
        uses: actions/checkout@v4

      - name: Record original source hash
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum lbed_benchmark.cpp > lbed_original_source_sha256.txt
          cat lbed_original_source_sha256.txt

      - name: Instrument LBED communication serialization
        shell: bash
        run: |
          set -euxo pipefail

          cp lbed_benchmark.cpp lbed_benchmark_original.cpp

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lbed_benchmark.cpp")

          src = path.read_text(
              encoding="utf-8"
          ).replace("\r\n", "\n")

          # -------------------------------------------------
          # Insert serialization helpers before encode_ctx().
          # -------------------------------------------------

          marker = (
              "static std::vector<unsigned char> "
              "encode_ctx("
          )

          if src.count(marker) != 1:
              raise SystemExit(
                  "ERROR: encode_ctx insertion marker mismatch"
              )

          helper = r'''
          static std::vector<unsigned char>
          encode_ciphertext_for_size(
              const Ciphertext& c)
          {
              std::vector<unsigned char> out;

              append_u64(
                  out,
                  static_cast<uint64_t>(
                      c.sensor_id.size()
                  )
              );

              out.insert(
                  out.end(),
                  c.sensor_id.begin(),
                  c.sensor_id.end()
              );

              append_u64(out, c.epoch);
              append_u64(out, c.seq);

              auto hb = encode_header(c.hdr);

              append_u64(
                  out,
                  static_cast<uint64_t>(
                      hb.size()
                  )
              );

              out.insert(
                  out.end(),
                  hb.begin(),
                  hb.end()
              );

              out.insert(
                  out.end(),
                  c.wrapped_key.begin(),
                  c.wrapped_key.end()
              );

              out.insert(
                  out.end(),
                  c.nonce.begin(),
                  c.nonce.end()
              );

              append_u64(
                  out,
                  static_cast<uint64_t>(
                      c.aead_ct.size()
                  )
              );

              out.insert(
                  out.end(),
                  c.aead_ct.begin(),
                  c.aead_ct.end()
              );

              append_u64(
                  out,
                  static_cast<uint64_t>(
                      c.aad_app.size()
                  )
              );

              out.insert(
                  out.end(),
                  c.aad_app.begin(),
                  c.aad_app.end()
              );

              return out;
          }

          static size_t
          cryptographic_overhead_size(
              const Ciphertext& c)
          {
              return
                  encode_header(c.hdr).size()
                  + KEY_BYTES
                  + NONCE_BYTES
                  + TAG_BYTES;
          }

          '''

          src = src.replace(
              marker,
              helper + marker,
              1
          )

          # -------------------------------------------------
          # Update human-readable column description.
          # -------------------------------------------------

          old_comment = (
              '# columns: '
              't,rep,offline_ms,poly_ms,'
              'group_ms,online_ms,'
              'decrypt_ms,correct'
          )

          new_comment = (
              '# columns: '
              't,rep,offline_ms,poly_ms,'
              'group_ms,online_ms,'
              'decrypt_ms,header_bytes,'
              'crypto_overhead_bytes,'
              'wire_bytes,correct'
          )

          if src.count(old_comment) != 1:
              raise SystemExit(
                  "ERROR: benchmark comment header mismatch"
              )

          src = src.replace(
              old_comment,
              new_comment,
              1
          )

          # -------------------------------------------------
          # Update actual CSV header.
          # -------------------------------------------------

          old_csv = (
              't,rep,offline_ms,poly_ms,'
              'group_ms,online_ms,'
              'decrypt_ms,correct'
          )

          new_csv = (
              't,rep,offline_ms,poly_ms,'
              'group_ms,online_ms,'
              'decrypt_ms,header_bytes,'
              'crypto_overhead_bytes,'
              'wire_bytes,correct'
          )

          if src.count(old_csv) != 1:
              raise SystemExit(
                  "ERROR: benchmark CSV header mismatch"
              )

          src = src.replace(
              old_csv,
              new_csv,
              1
          )

          # -------------------------------------------------
          # Instrument result output robustly.
          # -------------------------------------------------

          lines = src.splitlines()

          target_index = None

          for i, line in enumerate(lines):
              if "<< ms_since(c0,c1)" in line:
                  target_index = i
                  break

          if target_index is None:
              raise SystemExit(
                  "ERROR: decrypt timing output line not found"
              )

          if target_index + 1 >= len(lines):
              raise SystemExit(
                  "ERROR: incomplete benchmark output row"
              )

          next_line = lines[target_index + 1]

          if "<< (ok ? 1 : 0)" not in next_line:
              raise SystemExit(
                  "ERROR: correctness output line not found"
              )

          indent = (
              next_line[
                  :len(next_line)
                  - len(next_line.lstrip())
              ]
          )

          inserted = [
              (
                  indent
                  + "<< encode_header(ct.hdr).size() "
                  + "<< \",\""
              ),
              (
                  indent
                  + "<< cryptographic_overhead_size(ct) "
                  + "<< \",\""
              ),
              (
                  indent
                  + "<< encode_ciphertext_for_size(ct).size() "
                  + "<< \",\""
              ),
          ]

          lines[
              target_index + 1:
              target_index + 1
          ] = inserted

          src = "\n".join(lines) + "\n"

          path.write_text(
              src,
              encoding="utf-8"
          )

          print(
              "LBED COMMUNICATION INSTRUMENTATION PATCH APPLIED"
          )

          print("Added metrics:")
          print("  header_bytes")
          print("  crypto_overhead_bytes")
          print("  wire_bytes")
          PY

          diff -u \
            lbed_benchmark_original.cpp \
            lbed_benchmark.cpp \
            > lbed_communication_instrumentation.patch \
            || true

          test -s lbed_communication_instrumentation.patch

          echo "=== Instrumentation patch ==="
          cat lbed_communication_instrumentation.patch

          sha256sum lbed_benchmark.cpp \
            > lbed_instrumented_source_sha256.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libgmp-dev \
            git \
            python3

      - name: Fetch native herumi mcl
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --recursive \
            https://github.com/herumi/mcl.git \
            "$RUNNER_TEMP/mcl"

      - name: Record mcl revision
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/mcl"

          git rev-parse HEAD \
            > "$GITHUB_WORKSPACE/mcl_commit.txt"

          cat "$GITHUB_WORKSPACE/mcl_commit.txt"

      - name: Build native mcl
        working-directory: ${{ runner.temp }}/mcl
        shell: bash
        run: |
          set -euxo pipefail

          make -j2 \
            MCL_FP_BIT=384 \
            MCL_FR_BIT=256

          test -f lib/libmcl.a

      - name: Configure instrumented LBED harness
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S . -B build \
            -DMCL_ROOT="$RUNNER_TEMP/mcl" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build instrumented LBED harness
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build -j2

          test -x build/lbed_bench

      - name: Run LBED communication measurements
        shell: bash
        run: |
          set -o pipefail

          ./build/lbed_bench \
            --reps 5 \
            --warmup 2 \
            --payload 1024 \
            --t 32,64,128,256,512,1024 \
          | tee lbed_communication_raw.csv

      - name: Validate and summarize communication sizes
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import csv
          from pathlib import Path

          RAW = Path(
              "lbed_communication_raw.csv"
          )

          SUMMARY = Path(
              "lbed_communication_summary.csv"
          )

          EXPECTED_T = [
              32,
              64,
              128,
              256,
              512,
              1024,
          ]

          EXPECTED_REPS = 5
          PAYLOAD_BYTES = 1024

          lines = RAW.read_text(
              encoding="utf-8"
          ).splitlines()

          start = next(
              (
                  i
                  for i, line
                  in enumerate(lines)
                  if line.startswith("t,rep,")
              ),
              None
          )

          if start is None:
              raise SystemExit(
                  "ERROR: CSV header not found"
              )

          rows = list(
              csv.DictReader(
                  lines[start:]
              )
          )

          expected_rows = (
              len(EXPECTED_T)
              * EXPECTED_REPS
          )

          if len(rows) != expected_rows:
              raise SystemExit(
                  f"ERROR: expected {expected_rows} rows, "
                  f"got {len(rows)}"
              )

          grouped = {
              t: []
              for t in EXPECTED_T
          }

          for row in rows:
              t = int(row["t"])

              if t not in grouped:
                  raise SystemExit(
                      f"ERROR: unexpected t={t}"
                  )

              if row["correct"].strip() != "1":
                  raise SystemExit(
                      f"ERROR: correctness failure at t={t}"
                  )

              hb = int(
                  row["header_bytes"]
              )

              cob = int(
                  row["crypto_overhead_bytes"]
              )

              wb = int(
                  row["wire_bytes"]
              )

              if hb <= 0:
                  raise SystemExit(
                      f"ERROR: invalid header size at t={t}"
                  )

              if cob <= hb:
                  raise SystemExit(
                      f"ERROR: invalid cryptographic "
                      f"overhead at t={t}"
                  )

              if wb <= cob:
                  raise SystemExit(
                      f"ERROR: invalid wire size at t={t}"
                  )

              grouped[t].append(row)

          fields = [
              "t",
              "n",
              "header_bytes",
              "crypto_overhead_bytes",
              "wire_bytes",
              "payload_bytes",
              "header_over_payload_percent",
              "crypto_over_payload_percent",
              "wire_over_payload_percent",
          ]

          with SUMMARY.open(
              "w",
              newline="",
              encoding="utf-8"
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=fields
              )

              writer.writeheader()

              for t in EXPECTED_T:
                  group = grouped[t]

                  if len(group) != EXPECTED_REPS:
                      raise SystemExit(
                          f"ERROR: t={t} has "
                          f"{len(group)} rows"
                      )

                  header_sizes = {
                      int(r["header_bytes"])
                      for r in group
                  }

                  crypto_sizes = {
                      int(
                          r["crypto_overhead_bytes"]
                      )
                      for r in group
                  }

                  wire_sizes = {
                      int(r["wire_bytes"])
                      for r in group
                  }

                  if len(header_sizes) != 1:
                      raise SystemExit(
                          f"ERROR: header size varied at t={t}"
                      )

                  if len(crypto_sizes) != 1:
                      raise SystemExit(
                          f"ERROR: crypto overhead varied at t={t}"
                      )

                  if len(wire_sizes) != 1:
                      raise SystemExit(
                          f"ERROR: wire size varied at t={t}"
                      )

                  hb = next(iter(header_sizes))
                  cob = next(iter(crypto_sizes))
                  wb = next(iter(wire_sizes))

                  writer.writerow({
                      "t":
                          t,
                      "n":
                          EXPECTED_REPS,
                      "header_bytes":
                          hb,
                      "crypto_overhead_bytes":
                          cob,
                      "wire_bytes":
                          wb,
                      "payload_bytes":
                          PAYLOAD_BYTES,
                      "header_over_payload_percent":
                          f"{100.0 * hb / PAYLOAD_BYTES:.6f}",
                      "crypto_over_payload_percent":
                          f"{100.0 * cob / PAYLOAD_BYTES:.6f}",
                      "wire_over_payload_percent":
                          f"{100.0 * wb / PAYLOAD_BYTES:.6f}",
                  })

          print(
              "LBED COMMUNICATION SIZE DATASET PASSED"
          )

          print(
              f"Recipient-set sizes: {EXPECTED_T}"
          )

          print(
              f"Measurements per t: {EXPECTED_REPS}"
          )

          print(
              f"Validated rows: {len(rows)}"
          )

          for t in EXPECTED_T:
              r = grouped[t][0]

              print(
                  f"t={t}: "
                  f"header={r['header_bytes']} B, "
                  f"crypto_overhead="
                  f"{r['crypto_overhead_bytes']} B, "
                  f"wire={r['wire_bytes']} B"
              )

          print(
              "Serialized sizes were invariant "
              "across repetitions."
          )

          print(
              "No communication rows were removed."
          )
          PY

      - name: Record communication protocol
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "scheme=LBED"
            echo "measurement=serialized_communication_size"
            echo "curve=BLS12-381"
            echo "library=herumi-mcl"
            echo "mode=single-threaded"
            echo "build_type=Release"
            echo "payload_bytes=1024"
            echo "t_values=32,64,128,256,512,1024"
            echo "measurements_per_t=5"
            echo "warmup_repetitions=2"
            echo "outlier_removal=none"
            echo "header_encoding=existing_encode_header"
            echo "crypto_overhead=header_plus_wrapped_key_plus_nonce_plus_gcm_tag"
            echo "wire_encoding=canonical_benchmark_serialization"
            echo "wire_fields=sensor_id,epoch,seq,header,wrapped_key,nonce,aead_ciphertext,aad_app"
            echo "integer_lengths=8_byte_big_endian"
            echo "source_modification=pipeline_local_only"
            echo "repository_source_not_overwritten=yes"
            echo "mcl_commit=$(cat mcl_commit.txt)"
            echo "original_source_sha256=$(awk '{print $1}' lbed_original_source_sha256.txt)"
            echo "instrumented_source_sha256=$(awk '{print $1}' lbed_instrumented_source_sha256.txt)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -a)"
            echo "cpu_model=$(lscpu | grep 'Model name' | head -1)"
            echo "compiler=$(c++ --version | head -1)"
          } > lbed_communication_protocol.txt

      - name: Enforce communication evidence gate
        shell: bash
        run: |
          set -euo pipefail

          test -s lbed_communication_raw.csv
          test -s lbed_communication_summary.csv
          test -s lbed_communication_protocol.txt
          test -s lbed_communication_instrumentation.patch
          test -s lbed_original_source_sha256.txt
          test -s lbed_instrumented_source_sha256.txt
          test -s mcl_commit.txt

          SUMMARY_ROWS="$(tail -n +2 lbed_communication_summary.csv | wc -l | tr -d ' ')"

          echo "Observed summary rows: ${SUMMARY_ROWS}"

          if [ "${SUMMARY_ROWS}" -ne 6 ]; then
            echo "ERROR: expected 6 summary rows"
            exit 1
          fi

          grep -q '^32,' lbed_communication_summary.csv
          grep -q '^64,' lbed_communication_summary.csv
          grep -q '^128,' lbed_communication_summary.csv
          grep -q '^256,' lbed_communication_summary.csv
          grep -q '^512,' lbed_communication_summary.csv
          grep -q '^1024,' lbed_communication_summary.csv

          echo "LBED COMMUNICATION EVIDENCE GATE PASSED"
          echo "Recipient-set sizes: 32,64,128,256,512,1024"
          echo "Summary rows: ${SUMMARY_ROWS}"
          echo "Header, cryptographic overhead, and full wire sizes recorded."
          echo "No communication measurements were removed."

      - name: Upload LBED communication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbed-communication-size-results
          path: |
            lbed_communication_raw.csv
            lbed_communication_summary.csv
            lbed_communication_protocol.txt
            lbed_communication_instrumentation.patch
            lbed_original_source_sha256.txt
            lbed_instrumented_source_sha256.txt
            mcl_commit.txt
            lbed_benchmark.cpp
          if-no-files-found: warn
          retention-days: 90
