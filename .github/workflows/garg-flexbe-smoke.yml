name: Garg FlexBE Smoke Test

on:
  workflow_dispatch:

jobs:
  garg-flexbe-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout LBED benchmark repository
        uses: actions/checkout@v4

      - name: Record runner information
        run: |
          echo "=== GitHub Actions runner ==="
          uname -a
          lscpu | grep -E 'Model name|CPU\(s\)' || true

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libsodium-dev \
            libgmp-dev \
            libssl-dev \
            pkg-config \
            libffi-dev

          echo "=== Installed native dependencies ==="
          dpkg-query -W \
            build-essential \
            git \
            libsodium-dev \
            libgmp-dev \
            libssl-dev \
            pkg-config \
            libffi-dev

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone official FlexBroadcast repository
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            https://github.com/RachitG54/FlexBroadcast.git \
            FlexBroadcast

          cd FlexBroadcast

          git checkout \
            6c8e180d05de2e784437a0a4b191947d70b6c747

          echo "=== FlexBroadcast revision ==="
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = \
            "6c8e180d05de2e784437a0a4b191947d70b6c747"

      - name: Create Python 3.10 environment
        shell: bash
        run: |
          set -euxo pipefail

          python -m venv garg-venv
          source garg-venv/bin/activate

          echo "=== Python version ==="
          python --version

          python -m pip install --upgrade \
            "pip<24.1" \
            setuptools \
            wheel

      - name: Install FlexBroadcast Python dependencies
        shell: bash
        run: |
          set -euxo pipefail

          source garg-venv/bin/activate

          python -m pip install \
            "numpy<2" \
            scipy \
            petrelic==0.1.5

          echo "=== Installed Python packages ==="
          python -m pip freeze

      - name: Verify Petrelic BLS12-381 backend
        shell: bash
        run: |
          set -euxo pipefail

          source garg-venv/bin/activate

          python - <<'PY'
          from petrelic.multiplicative.pairing import G1, G2, GT

          g1 = G1.generator()
          g2 = G2.generator()

          assert g1 is not None
          assert g2 is not None

          print("PETRELIC IMPORT PASSED")
          print("G1 generator available")
          print("G2 generator available")
          print("PETRELIC BACKEND SMOKE TEST PASSED")
          PY

      - name: Inspect official test harness
        working-directory: FlexBroadcast
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Repository root ==="
          ls -la

          echo "=== testscript.sh ==="
          cat testscript.sh

          test -f testscript.sh

      - name: Run official FlexBroadcast correctness tests
        working-directory: FlexBroadcast
        shell: bash
        run: |
          source ../garg-venv/bin/activate

          set +e
          set -o pipefail

          bash testscript.sh \
            2>&1 | tee ../garg_flexbe_test.log

          TEST_STATUS=${PIPESTATUS[0]}

          echo "${TEST_STATUS}" \
            > ../garg_flexbe_test_exit_code.txt

          echo "Official testscript.sh exit code: ${TEST_STATUS}"

          exit "${TEST_STATUS}"

      - name: Record reproduction environment
        if: always()
        shell: bash
        run: |
          {
            echo "comparison=Garg-Lu-Waters-Wu-Flexible-Broadcast-Encryption"
            echo "repository=RachitG54/FlexBroadcast"
            echo "commit=6c8e180d05de2e784437a0a4b191947d70b6c747"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "kernel=$(uname -a)"
            echo "cpu_model=$(lscpu | grep 'Model name' | head -1)"
            echo "python=$(python --version 2>&1)"
            echo "libsodium=$(dpkg-query -W -f='${Version}' libsodium-dev 2>/dev/null || true)"
            echo "test_type=official-correctness-smoke-test"
            echo "benchmark_output_may_appear_in_test_log=yes"
            echo "performance_data_eligible_for_paper=no"
          } > garg_flexbe_environment.txt

          if [ -f garg_flexbe_test_exit_code.txt ]; then
            echo "official_test_exit_code=$(cat garg_flexbe_test_exit_code.txt)" \
              >> garg_flexbe_environment.txt
          fi

          if [ -x garg-venv/bin/python ]; then
            {
              echo
              echo "=== Python packages ==="
              garg-venv/bin/python -m pip freeze
            } >> garg_flexbe_environment.txt
          fi

      - name: Enforce Garg correctness gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          test -s garg_flexbe_test.log
          test -s garg_flexbe_test_exit_code.txt

          TEST_STATUS="$(cat garg_flexbe_test_exit_code.txt)"

          echo "Recorded official test exit code: ${TEST_STATUS}"

          if [ "${TEST_STATUS}" != "0" ]; then
            echo "GARG FLEXBE CORRECTNESS GATE FAILED"
            echo "Official FlexBroadcast testscript.sh returned non-zero."
            exit 1
          fi

          grep -q \
            "Testing Decryption" \
            garg_flexbe_test.log

          grep -q \
            "Testing the centralized broadcast scheme" \
            garg_flexbe_test.log

          grep -q \
            "Testing the public key encryption scheme" \
            garg_flexbe_test.log

          echo "GARG FLEXBE CORRECTNESS GATE PASSED"
          echo "Official FlexBroadcast testscript.sh exited with code 0."
          echo "Expected authorized and unauthorized decryption tests completed."
          echo "Negative-decryption labels such as 'Failed: user X' are expected"
          echo "for recipients intentionally excluded from the broadcast set."
          echo "Repository revision:"

          cd FlexBroadcast
          git rev-parse HEAD

      - name: Upload Garg smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garg-flexbe-smoke-evidence
          path: |
            garg_flexbe_test.log
            garg_flexbe_test_exit_code.txt
            garg_flexbe_environment.txt
          if-no-files-found: warn
          retention-days: 90
